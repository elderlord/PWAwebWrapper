<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidden Touch Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* Zone indicators */
    .zone {
      position: absolute;
      border: 2px dashed #ff6b6b;
      background: rgba(255, 107, 107, 0.1);
      pointer-events: none;
    }

    .top-left {
      top: 0;
      left: 0;
      width: 15%;
      height: 15%;
    }

    .top-right {
      top: 0;
      right: 0;
      width: 15%;
      height: 15%;
    }

    .bottom-left {
      bottom: 0;
      left: 0;
      width: 15%;
      height: 15%;
    }

    .bottom-right {
      bottom: 0;
      right: 0;
      width: 15%;
      height: 15%;
    }

    /* Status display */
    #status {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #333;
      z-index: 100;
    }

    #status .subtitle {
      font-size: 14px;
      color: #666;
      margin-top: 20px;
    }

    /* Tap counter display */
    #tap-counter {
      position: fixed;
      top: 20px;
      left: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 15px;
      border-radius: 4px;
      z-index: 100;
    }

    /* Zone selector */
    #zone-selector {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      font-size: 14px;
    }

    #zone-selector select {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
      cursor: pointer;
    }

    /* Activated state */
    body.activated {
      background: linear-gradient(135deg, #4CAF50, #45a049);
    }

    #status.activated {
      color: white;
      font-size: 48px;
      animation: pulse 0.5s ease-in-out;
    }

    #status.activated .subtitle {
      color: rgba(255, 255, 255, 0.9);
      font-size: 16px;
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.1); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    /* Layout info */
    .info {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 12px;
      color: #999;
      max-width: 300px;
      line-height: 1.4;
    }

    .info p {
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <!-- Zone indicators -->
  <div class="zone top-left"></div>
  <div class="zone top-right"></div>
  <div class="zone bottom-left"></div>
  <div class="zone bottom-right"></div>

  <!-- Zone selector -->
  <div id="zone-selector">
    <select id="zone-select">
      <option value="top-left">Zone: Top-Left</option>
      <option value="top-right">Zone: Top-Right</option>
      <option value="bottom-left">Zone: Bottom-Left</option>
      <option value="bottom-right">Zone: Bottom-Right</option>
    </select>
  </div>

  <!-- Tap counter -->
  <div id="tap-counter">Taps: 0</div>

  <!-- Status display -->
  <div id="status">
    <div>Tap zone 5 times</div>
    <div class="subtitle">(within 500ms)</div>
  </div>

  <!-- Info -->
  <div class="info">
    <p>Test Instructions:</p>
    <p>1. Select a zone from dropdown</p>
    <p>2. Rapidly tap the zone 5 times</p>
    <p>3. Must complete within 500ms timeout</p>
    <p>4. Try multi-touch to verify prevention</p>
  </div>

  <!-- Scripts -->
  <script src="js/hidden-touch.js"></script>
  <script>
    let detector = null;
    let tapCountDisplay = 0;

    function initDetector(zone) {
      if (detector) {
        detector.detach();
      }

      detector = new HiddenTouchDetector(
        { zone: zone, tapCount: 5, tapTimeout: 500 },
        onActivate
      );

      detector.attachTo(document.body);
      console.log(`Detector initialized for zone: ${zone}`);
    }

    function onActivate() {
      const statusEl = document.getElementById('status');
      const counterEl = document.getElementById('tap-counter');

      // Visual feedback
      document.body.classList.add('activated');
      statusEl.classList.add('activated');
      statusEl.innerHTML = '<div>ACTIVATED!</div><div class="subtitle">Admin mode unlocked</div>';
      counterEl.textContent = 'Taps: 0';
      tapCountDisplay = 0;

      // Reset after 2 seconds
      setTimeout(() => {
        document.body.classList.remove('activated');
        statusEl.classList.remove('activated');
        const zone = document.getElementById('zone-select').value;
        statusEl.innerHTML = `<div>Tap zone 5 times</div><div class="subtitle">(within 500ms)</div>`;
      }, 2000);
    }

    // Monkey-patch the detector's _handleTouch to update tap counter
    function patchDetectorDisplay() {
      const originalHandleTouch = detector._handleTouch.bind(detector);
      detector._handleTouch = function(event) {
        originalHandleTouch(event);
        // Update counter display
        tapCountDisplay = this.taps.length;
        document.getElementById('tap-counter').textContent = `Taps: ${tapCountDisplay}`;
      };
    }

    // Zone selector
    document.getElementById('zone-select').addEventListener('change', (e) => {
      const zone = e.target.value;
      initDetector(zone);
      patchDetectorDisplay();
    });

    // Initialize with default zone
    initDetector('top-left');
    patchDetectorDisplay();

    // Prevent iOS gestures
    HiddenTouchDetector.preventIOSGestures();

    console.log('Hidden Touch Detector Test Page Loaded');
    console.log('Try tapping in the zone marked with red dashed border 5 times quickly');
  </script>
</body>
</html>
